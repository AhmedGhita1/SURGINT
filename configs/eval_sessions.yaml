dataset_id: production_v5
data_root: data/synthetic/production_v5/dataset
run_dir: outputs/runs

task: detection-tracking

# each session is one continuous camera orbit.
# the tracker is reset between sessions
split: eval
sessions:
  - session_000
  - session_001
  - session_002
  - session_003
  - session_004
  - session_005
  - session_006
  - session_007
  - session_008
  - session_009
  - session_010
  - session_011
  - session_012
  - session_013
  - session_014
  - session_015


batch_size: 1
iou_threshold: 0.5

metrics: [MOTA, IDF1, id_switches]
select_metric: MOTA

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the floor from requires-python, and the version development happens on
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # cache the models downloaded by the HF transformers
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rtdetr

      # the CPU build is ~2.5 GB smaller and the runner has no GPU
      - run: pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pip install -e .

      - run: ruff check services surgint tests

      - run: python -m pytest -q tests/unit
      - run: python -m pytest -q tests/integration
      - run: python -m pytest -q tests/model

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rtdetr

      - run: pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install .

      # the image needs a checkpoint to serve
      - run: python .github/scripts/ci_checkpoint.py models/ci

      - run: docker build --target ci -t surgint:ci .

      - name: start the container
        run: |
          # Standard GitHub runners have no GPU. This override checks the
          # GPU-capable image's packaging and API without changing its CUDA default.
          docker run -d --name surgint-ci \
            -e SURGINT_DEVICE=cpu \
            -p 127.0.0.1:8000:7860 \
            surgint:ci
          for _ in $(seq 90); do
            if curl -fsS -m 2 http://127.0.0.1:8000/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "the api did not become ready"
          exit 1


      - name: the image serves the installed package
        run: |
          paths=$(docker exec surgint-ci python -c 'import services, surgint; print(surgint.__file__, services.__file__)')
          echo "$paths"
          case "$paths" in
            *site-packages*site-packages*) ;;
            *) echo "a source copy in the image shadows the installed package"; exit 1 ;;
          esac

      - run: bash docker/smoke.sh

      - if: always()
        run: docker logs surgint-ci

  publish-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/ahmedghita1/surgint-instruments
      HF_MODEL_ID: AhmedGhita/surgint-instruments-rt-detr
      HF_MODEL_REVISION: ${{ vars.HF_MODEL_REVISION }}
    steps:
      - uses: actions/checkout@v4

      - name: verify release version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${GITHUB_REF_NAME#v}" = "$version"

      - name: log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and publish the production image
        run: |
          test -n "$HF_MODEL_REVISION"
          version="${GITHUB_REF_NAME#v}"
          docker build --target production \
            --build-arg "HF_MODEL_ID=$HF_MODEL_ID" \
            --build-arg "HF_MODEL_REVISION=$HF_MODEL_REVISION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_NAME:$version" \
            --tag "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$version"
          docker push "$IMAGE_NAME:latest"

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the floor from requires-python, and the version development happens on
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # cache the models downloaded by the HF transformers
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rtdetr

      # the CPU build is ~2.5 GB smaller and the runner has no GPU
      - run: pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pip install -e .

      - run: ruff check src tests

      - run: pytest -q

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "surgint"
description = "Surgical Instrument Intelligence. Real-time detection, tracking, and stateful inventory of surgical instruments in the operating room."
readme = "README.md"
version = "0.1.0.dev0"
requires-python = ">=3.10"
dependencies = [
    "imageio[ffmpeg]==2.36.0",
    "motmetrics==1.4.0",
    "numpy==1.26.4",
    "owlready2==0.47",
    "pillow==10.4.0",
    "pycocotools==2.0.8",
    "pyyaml==6.0.2",
    "scipy==1.14.1",
    "torch==2.4.1",
    "tqdm==4.68.3",
    "transformers==4.46.3",
]

[project.optional-dependencies]
training = [
    "wandb==0.30.0",
]
serving = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "uvicorn==0.53.0",
]
dev = [
    "httpx2==2.13.1",
    "pytest==8.3.3",
    "ruff==0.16.8",
    "tomli==2.4.1; python_version < '3.11'",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "surgint*"]

[tool.setuptools.package-data]
"surgint.ontology" = ["*.owl"]
"surgint.policy" = ["*.yaml"]
